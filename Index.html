<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opal Beauty Salon</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#FFF7F8;color:#4A2C2A}
nav{background:rgba(255,255,255,0.95);padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;border-bottom:1px solid #F3D1D7}
.logo{font-size:32px;font-weight:900;color:#8B6A3A}
.logo span{display:block;font-size:11px;color:#B18A6E}
.btn-wa{background:#8B6A3A;color:#fff;padding:12px 28px;border-radius:30px;text-decoration:none;font-weight:700}
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:80vh}
.hero-img{background:url('https://images.unsplash.com/photo-1560869713-7d0a29430803?w=800') center/cover}
.hero-text{background:linear-gradient(135deg,#FFF0F2,#FFE4E8);padding:60px 50px;display:flex;flex-direction:column;justify-content:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:60px 5%}
.card{background:#fff;border:1px solid #E8C4A8;border-radius:20px;padding:35px;text-align:center}
@media(max-width:768px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
<div class="logo">OPAL <span>صالون أوبال • الأشرفية</span></div>
<a href="https://wa.me/96176869855?text=مرحبا%20بدي%20احجز%20موعد" class="btn-wa">احجزي واتساب</a>
</nav>
<div class="hero">
<div class="hero-img"></div>
<div class="hero-text">
<h1>ارتقي بجمالك في الأشرفية</h1>
<p>خدمات شعر، أظافر ومكياج فاخرة في أرقى صالون ببيروت</p>
<a href="https://wa.me/96176869855?text=مرحبا%20بدي%20احجز%20موعد" class="btn-wa">احجزي عبر واتساب 💬</a>
</div>
</div>
<div class="cards">
<div class="card">💇‍♀️<h3>شعر</h3><p>تصفيف • تلوين • كيراتين</p></div>
<div class="card">💅<h3>أظافر</h3><p>مانيكير • جل • فن الأظافر</p></div>
<div class="card">💄<h3>مكياج</h3><p>عروس • سهرة • مناسبات</p></div>
</div>
</body>
</html>
